[project]
name = "minisplit-controller"
version = "2.0.0"
description = "A small controller that tries to make a Mitsubishi mini-split hold one steady temperature."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
minisplit-controller = "minisplit_controller.controller:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
