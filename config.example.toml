# Copy to config.toml (git-ignored) or point MSC_CONFIG at it.
# Environment variables override these values. Credentials never go here:
# set MITSUBISHI_COMFORT_EMAIL and MITSUBISHI_COMFORT_PASSWORD in the environment.

[controller]
device = ""            # unit serial or name from `python client/mitsubishi.py status` (env: MSC_DEVICE)
sensor_name = ""       # optional wireless sensor name if it is not linked to the unit (env: MSC_SENSOR_NAME)
# client_cmd = "python3 client/mitsubishi.py"   # env: MSC_CLIENT_CMD
# data_dir = "var"                               # state, log.csv, heartbeat (env: MSC_DATA_DIR)
# latitude = 0.0       # enables the outdoor-temperature gate (env: MSC_LATITUDE)
# longitude = 0.0      # (env: MSC_LONGITUDE)
interval_s = 600       # seconds between cycles (env: MSC_INTERVAL_S)
timezone = "America/Los_Angeles"   # IANA zone for log timestamps (env: MSC_TIMEZONE)
skip_recent_s = 300    # loop skips its cycle if a cycle (e.g. from scripts/kick.sh) ran this recently (env: MSC_SKIP_RECENT_S)

[tuning]               # defaults shown; see README "Tuning"
target_f = 70.0
heat_min = 66
heat_max = 71
cool_park = 76
heat_park = 66
fan = "auto"           # used only when fan_staging = false
# Fan staging: e = Tp - cool target (cool) or target_f - Tp (heat); first row with e <= x wins
fan_staging = true
fan_stages = [[0.3, "quiet"], [0.8, "low"], [1.5, "low"], [2.5, "powerful"], [inf, "superPowerful"]]
fan_down_hyst_f = 0.3         # step down only when e <= lower stage's threshold - this ...
fan_down_cycles = 2           # ... on this many consecutive cycles
fan_max_up = 2                # step up immediately, at most this many stages per cycle
fan_cool_target_default_f = 72.0   # cool target for fan staging without an outdoor reading
sensor_max_age_min = 20.0
history_h = 4.0
gap_max_min = 30.0
predict_h = 0.25
slope_limit = 2.0
regime_min_h = 3.0
sun_dwell_h = 1.0
heat_to_cool_f = 73.0
heat_to_cool_hold_min = 20.0
sun_override_f = 73.0
cool_to_heat_f = 68.0
cool_to_heat_hold_min = 45.0
outdoor_min_f = 62.0
outdoor_max_age_h = 2.0
step_min = 15.0
trim_every_h = 3.0
trim_cover_h = 2.5
trim_deadband_f = 0.4
trim_min = -1
trim_max = 2
heat_table = [[70.6, 66], [70.0, 67], [69.4, 68], [68.8, 69], [68.2, 70]]   # Tp >= x -> heat SP; else heat_max
cool_table = [[70.5, 78], [71.0, 77], [71.5, 76], [72.0, 75], [72.5, 74]]   # Tp <= x -> cool SP; else cool_floor
cool_floor = 73        # lowest cool SP on warm days or without outdoor data
# Outdoor-adaptive cooling: only with an outdoor reading <= outdoor_max_age_h old (needs latitude/longitude)
adaptive_cool = true
cool_target_out_lo_f = 55.0   # outdoor at or below this -> cool target cool_target_lo_f
cool_target_out_hi_f = 80.0   # outdoor at or above this -> cool target cool_target_hi_f (linear between)
cool_target_lo_f = 70.5
cool_target_hi_f = 73.5
cool_offsets = [[-1.5, 78], [-1.0, 77], [-0.5, 76], [0.0, 75], [0.5, 74], [1.0, 73], [1.5, 72]]   # Tp <= target + x -> cool SP
cool_offsets_else = 71
cool_floor_table = [[68.0, 71]]   # outdoor < x -> lowest cool SP; else cool_floor
cool_min = 71
heat_to_cool_margin_f = 1.5   # heat -> cool entry = min(heat_to_cool_f, cool target + this)
cool_max = 78
cool_big_err_f = 1.5          # cool step-down is cool_big_step (not 1F) when Tp - cool target > this
cool_big_step = 2
cool_fallback_target_f = 72.0 # cool target for that check without an outdoor reading
